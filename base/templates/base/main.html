{% include 'base/navbar.html' %}
<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{% static 'styles/style.css' %}">

  <title>PostGrad Pathways</title>
</head>

<body>
  {% if messages %}
  <ul class="messages">
    {% for message in messages %}
    <li>{{ message }}</li>
    {% endfor %}
  </ul>
  {% endif %}

  <main class="layout">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <script src="{% static 'js/script.js' %}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const userContainer = document.querySelector('.header__userContainer');
      const dropdown = document.getElementById('dropdownMenu');
      const userButton = userContainer.querySelector('.header__user');
  
      userButton.addEventListener('click', function (e) {
        e.stopPropagation();  // Prevent this click from bubbling to document
        dropdown.classList.toggle('show-dropdown');
      });
  
      document.addEventListener('click', function (event) {
        if (!userContainer.contains(event.target)) {
          dropdown.classList.remove('show-dropdown');
        }
      });
    });
  </script>  
</body>
</html>
